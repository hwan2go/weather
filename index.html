<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고양 날씨</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Jua', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: linear-gradient(160deg, #ffe3ec, #e3f0ff); color: #4a4458;
    transition: background .6s;
  }
  body.sunny  { background: linear-gradient(160deg, #fff1c9, #ffd9e2); }
  body.cloudy { background: linear-gradient(160deg, #e8ecf5, #d6dff0); }
  body.rainy  { background: linear-gradient(160deg, #cfe0f5, #b8c6e6); }
  body.snowy  { background: linear-gradient(160deg, #f2f6ff, #dfe7fb); }
  body.night  { background: linear-gradient(160deg, #3b3a6b, #6b5b95); color: #f3eefc; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .card {
    position: relative; z-index: 1;
    width: min(92vw, 380px); padding: 28px 24px; text-align: center;
    background: rgba(255,255,255,.48); border-radius: 36px;
    box-shadow: 0 12px 40px rgba(120,100,160,.2); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  body.night .card { background: rgba(255,255,255,.12); }
  select {
    font: inherit; font-size: 17px; padding: 6px 14px; border: 2px solid #fff;
    border-radius: 20px; background: rgba(255,255,255,.9); color: #4a4458; cursor: pointer;
  }
  select option, select optgroup { background: #fff; color: #4a4458; }
  select optgroup { color: #d6648a; font-weight: bold; }
  .date { margin-top: 14px; font-size: 15px; opacity: .8; }
  .time { font-size: 52px; letter-spacing: 2px; margin: 2px 0 6px; }
  .icon { font-size: 96px; line-height: 1.1; animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .tlabel { display: inline-block; margin-top: 2px; padding: 3px 12px; border-radius: 14px; font-size: 13px; background: rgba(255,255,255,.6); }
  body.night .tlabel { background: rgba(255,255,255,.15); }
  .tlabel.old { background: #ffe1a8; color: #7a4b00; }
  .temp { font-size: 64px; margin: 4px 0 0; }
  .desc { font-size: 20px; margin-top: 2px; }
  .feel { font-size: 14px; opacity: .75; margin-top: 8px; }
  .msg { margin-top: 18px; padding: 10px 14px; border-radius: 18px; background: rgba(255,255,255,.6); font-size: 15px; }
  body.night .msg { background: rgba(255,255,255,.15); }
  .air { margin-top: 16px; padding: 12px; text-align: left; border-radius: 22px; background: rgba(255,255,255,.55); }
  body.night .air { background: rgba(255,255,255,.12); }
  .air .sec-title { margin-bottom: 8px; }
  .badge { padding: 2px 10px; border-radius: 12px; font-size: 12px; color: #fff; background: #b9b2c9; }
  .aq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .aq { padding: 8px 10px; border-radius: 16px; background: rgba(255,255,255,.65); }
  body.night .aq { background: rgba(255,255,255,.12); }
  .aq .n { font-size: 12px; opacity: .75; }
  .aq .v { font-size: 22px; margin: 2px 0 4px; } .aq .v small { font-size: 11px; opacity: .7; }
  .aq .g { font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
  .aq .g i { width: 9px; height: 9px; border-radius: 50%; background: #b9b2c9; display: inline-block; }
  .aq-note { margin-top: 6px; font-size: 10px; opacity: .55; }
  .hourly { margin-top: 18px; text-align: left; }
  .sec-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 8px; }
  .sec-title b { font-size: 15px; font-weight: normal; }
  .sec-title span { font-size: 11px; opacity: .6; }
  .weekly { margin-top: 20px; padding: 14px 12px 8px; text-align: left; border-radius: 26px; background: rgba(255,255,255,.55); }
  body.night .weekly { background: rgba(255,255,255,.12); }
  .day { display: grid; grid-template-columns: 36px 28px 38px 46px 1fr 46px; align-items: center; gap: 4px; padding: 7px 2px; border-top: 1px dashed rgba(120,100,160,.25); font-size: 15px; }
  .day:first-of-type { border-top: 0; }
  .day .dn { font-size: 14px; } .day .dn.sat { color: #5b8def; } .day .dn.sun { color: #e8648c; } .day .dn.today { font-weight: bold; }
  .day .di { font-size: 22px; text-align: center; }
  .day .dp { font-size: 11px; opacity: .75; }
  .day .lo { text-align: right; color: #4f86d8; } .day .hi { text-align: left; color: #e0577f; }
  body.night .day .lo { color: #a9ccff; } body.night .day .hi { color: #ffb0c8; }
  .day .lo small, .day .hi small { display: block; font-size: 10px; line-height: 1; opacity: .8; margin-bottom: 2px; }
  .bar { position: relative; height: 6px; border-radius: 3px; background: rgba(120,100,160,.18); }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #8ec5ff, #ffb6cc); }
  .hourly h2 { font-size: 15px; font-weight: normal; margin: 0 0 8px 4px; opacity: .8; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x proximity; }
  .hr { flex: 0 0 auto; width: 62px; padding: 10px 0; text-align: center; border-radius: 20px;
        background: rgba(255,255,255,.6); scroll-snap-align: start; }
  body.night .hr { background: rgba(255,255,255,.15); }
  body .hr.now { background: #ffb6cc; color: #fff; }
  .hr .h { font-size: 13px; opacity: .85; }
  .hr .i { font-size: 26px; margin: 4px 0 2px; }
  .hr .t { font-size: 17px; }
  .hr .p { font-size: 11px; min-height: 14px; margin-top: 2px; opacity: .8; }
  .small { margin-top: 14px; font-size: 12px; opacity: .6; }
  button { font: inherit; font-size: 13px; margin-top: 10px; padding: 6px 14px; border: 0; border-radius: 16px; background: #ffb6cc; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="card">
  <select id="city"></select>
  <div class="date" id="date"></div>
  <div class="time" id="time">--:--</div>
  <div class="icon" id="icon">⏳</div>
  <div class="tlabel" id="tlabel">현재 기온</div>
  <div class="temp" id="temp">--°</div>
  <div class="desc" id="desc">불러오는 중...</div>
  <div class="feel" id="feel"></div>
  <div class="msg" id="msg">날씨를 가져오고 있어요 ☁️</div>
  <div class="air">
    <div class="sec-title"><b>🌫️ 대기질</b><span class="badge" id="aqBadge">확인 중</span></div>
    <div class="aq-grid">
      <div class="aq"><div class="n">미세먼지 PM10</div><div class="v" id="v10">--</div><div class="g"><i id="d10"></i><span id="g10">-</span></div></div>
      <div class="aq"><div class="n">초미세먼지 PM2.5</div><div class="v" id="v25">--</div><div class="g"><i id="d25"></i><span id="g25">-</span></div></div>
    </div>
    <div class="aq-note" id="aqNote"></div>
  </div>
  <div class="hourly"><div class="sec-title"><b>⏰ 시간별 예보</b><span>옆으로 밀어 보세요 →</span></div><div class="strip" id="strip"></div></div>
  <div class="weekly"><div class="sec-title"><b>🗓️ 주간 예보</b><span>7일</span></div><div id="week"></div></div>
  <button id="loc">📍 내 위치로 보기</button>
  <div class="small" id="small"></div>
</div>

<script>
// 한국 주요 도시 (위도, 경도)
// 고양시 동네별 대략적인 중심 좌표 (위도, 경도)
const GROUPS = {
  "일산동구": {
    "마두동": [37.6525, 126.7775], "백석동": [37.6432, 126.7880], "장항동": [37.6580, 126.7640],
    "중산동": [37.6690, 126.7830], "풍동": [37.6770, 126.7900], "식사동": [37.6850, 126.8180],
    "정발산": [37.6595, 126.7740]
  },
  "일산서구": {
    "주엽동": [37.6700, 126.7611], "대화동": [37.6763, 126.7473], "탄현동": [37.6930, 126.7670],
    "일산동": [37.6824, 126.7691], "덕이동": [37.7010, 126.7530], "킨텍스": [37.6690, 126.7450]
  },
  "덕양구": {
    "화정동": [37.6340, 126.8320], "행신동": [37.6125, 126.8330], "능곡동": [37.6180, 126.8170],
    "원당동": [37.6531, 126.8429], "성사동": [37.6500, 126.8340], "원흥동": [37.6450, 126.8730],
    "삼송동": [37.6531, 126.8957], "향동동": [37.6020, 126.8800], "관산동": [37.6990, 126.8880]
  }
};
const CITIES = {};
for (const g in GROUPS) Object.assign(CITIES, GROUPS[g]);
// WMO 날씨코드 -> [이모지, 설명, 테마]
function wmo(c, isDay) {
  if (c === 0) return isDay ? ["☀️","맑음","sunny"] : ["🌙","맑은 밤","night"];
  if (c <= 2) return isDay ? ["🌤️","구름 조금","sunny"] : ["☁️","구름 조금","night"];
  if (c === 3) return ["☁️","흐림","cloudy"];
  if (c <= 48) return ["🌫️","안개","cloudy"];
  if (c <= 57) return ["🌦️","이슬비","rainy"];
  if (c <= 67) return ["🌧️","비","rainy"];
  if (c <= 77) return ["❄️","눈","snowy"];
  if (c <= 82) return ["🌧️","소나기","rainy"];
  if (c <= 86) return ["🌨️","눈보라","snowy"];
  return ["⛈️","천둥번개","rainy"];
}
function message(t, theme) {
  if (theme === "rainy") return "우산 꼭 챙기세요 ☂️";
  if (theme === "snowy") return "눈이 와요, 미끄럼 조심! ⛄";
  if (t <= 0) return "꽁꽁 추워요, 두툼하게 입어요 🧣";
  if (t <= 10) return "쌀쌀해요, 따뜻한 겉옷 필요해요 🧥";
  if (t <= 20) return "선선해서 나들이하기 좋아요 🌸";
  if (t <= 27) return "포근한 하루예요 😊";
  return "더워요, 물 많이 마셔요 🧊";
}

const $ = id => document.getElementById(id);
const sel = $("city");
const meOpt = new Option("📍 내 위치", "__me__"); meOpt.hidden = true; sel.add(meOpt);
for (const g in GROUPS) {
  const og = document.createElement("optgroup"); og.label = g;
  for (const name in GROUPS[g]) og.appendChild(new Option(name, name));
  sel.appendChild(og);
}
let current = "원흥동";
sel.value = current;

// 현재 시간 (한국 시간)
function tick() {
  const now = new Date();
  $("time").textContent = now.toLocaleTimeString("ko-KR", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit", hour12: false });
  $("date").textContent = now.toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul", month: "long", day: "numeric", weekday: "long" });
}
tick(); setInterval(tick, 1000);

function renderHourly(h, nowTime) {
  const strip = $("strip"); strip.innerHTML = "";
  let start = h.time.findIndex(t => t >= nowTime.slice(0, 13));
  if (start < 0) start = 0;
  for (let i = start; i < Math.min(start + 24, h.time.length); i++) {
    const [icon] = wmo(h.weather_code[i], h.is_day[i]);
    const hour = Number(h.time[i].slice(11, 13));
    const pop = h.precipitation_probability[i];
    const el = document.createElement("div");
    el.className = "hr" + (i === start ? " now" : "");
    el.innerHTML = '<div class="h">' + (i === start ? "지금" : hour + "시") + '</div>' +
      '<div class="i">' + icon + '</div>' +
      '<div class="t">' + Math.round(h.temperature_2m[i]) + '°</div>' +
      '<div class="p">' + (pop > 0 ? "💧" + pop + "%" : "") + '</div>';
    strip.appendChild(el);
  }
}

// 한국 기준 등급 (㎍/㎥)
const AQ_COLORS = ["#4f86d8", "#3aa76d", "#f08a24", "#e0405f"], AQ_NAMES = ["좋음", "보통", "나쁨", "매우나쁨"];
const grade10 = v => v <= 30 ? 0 : v <= 80 ? 1 : v <= 150 ? 2 : 3;
const grade25 = v => v <= 15 ? 0 : v <= 35 ? 1 : v <= 75 ? 2 : 3;
function airCell(id, v, g) {
  $("v" + id).innerHTML = Math.round(v) + "<small> ㎍/㎥</small>";
  $("g" + id).textContent = AQ_NAMES[g];
  $("d" + id).style.background = AQ_COLORS[g];
}
async function loadAir(lat, lon) {
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 10000);
    const r = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm10,pm2_5&timezone=Asia%2FSeoul`, { signal: ctl.signal });
    clearTimeout(to);
    if (!r.ok) throw new Error("대기질 응답 " + r.status);
    const c = (await r.json()).current;
    const g10 = grade10(c.pm10), g25 = grade25(c.pm2_5), worst = Math.max(g10, g25);
    airCell("10", c.pm10, g10); airCell("25", c.pm2_5, g25);
    const b = $("aqBadge"); b.textContent = "대기질 " + AQ_NAMES[worst]; b.style.background = AQ_COLORS[worst];
    $("aqNote").textContent = (worst >= 2 ? "😷 마스크를 챙기세요. " : "") + "모델 추정치라 실제 측정값과 다를 수 있어요.";
  } catch (e) {
    $("aqBadge").textContent = "측정 불가"; $("aqBadge").style.background = "#b9b2c9";
    $("aqNote").textContent = "대기질을 가져오지 못했어요.";
  }
}

function renderWeekly(dd) {
  const box = $("week"); box.innerHTML = "";
  const lo = Math.min(...dd.temperature_2m_min), hi = Math.max(...dd.temperature_2m_max), span = Math.max(1, hi - lo);
  dd.time.forEach((d, i) => {
    const [icon] = wmo(dd.weather_code[i], 1);
    const wd = new Date(d + "T00:00:00").getDay();
    const name = i === 0 ? "오늘" : "일월화수목금토"[wd];
    const mn = dd.temperature_2m_min[i], mx = dd.temperature_2m_max[i], pop = dd.precipitation_probability_max[i];
    const row = document.createElement("div"); row.className = "day";
    row.innerHTML = '<div class="dn' + (i === 0 ? " today" : wd === 6 ? " sat" : wd === 0 ? " sun" : "") + '">' + name + '</div>' +
      '<div class="di">' + icon + '</div>' +
      '<div class="dp">' + (pop > 0 ? "💧" + pop + "%" : "") + '</div>' +
      '<div class="lo"><small>최저</small>' + Math.round(mn) + '°</div>' +
      '<div class="bar"><i style="left:' + ((mn - lo) / span * 100) + '%;right:' + ((hi - mx) / span * 100) + '%"></i></div>' +
      '<div class="hi"><small>최고</small>' + Math.round(mx) + '°</div>';
    box.appendChild(row);
  });
}

// 30분마다 자동 새로고침 (선택한 동네 또는 내 위치 기준)
const REFRESH_MS = 30 * 60 * 1000;
let lastCoords = null, lastLoaded = 0;

async function load(lat, lon) {
  lastCoords = [lat, lon]; lastLoaded = Date.now();
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,apparent_temperature,weather_code,is_day` +
      `&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=7&timezone=Asia%2FSeoul`;
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 10000);
    const res = await fetch(url, { signal: ctl.signal }); clearTimeout(to);
    if (!res.ok) throw new Error("서버 응답 " + res.status);
    const data = await res.json();
    const d = data.current;
    const [icon, desc, theme] = wmo(d.weather_code, d.is_day);
    const t = Math.round(d.temperature_2m);
    $("icon").textContent = icon;
    $("temp").textContent = t + "°";
    const ago = Math.max(0, Math.round((Date.now() - Date.parse(d.time + ":00+09:00")) / 60000));
    const agoTxt = ago < 1 ? "방금" : ago < 60 ? ago + "분 전" : Math.floor(ago / 60) + "시간 " + (ago % 60) + "분 전";
    $("tlabel").textContent = "현재 기온 · " + d.time.slice(11, 16) + " 기준 (" + agoTxt + ")";
    $("tlabel").classList.toggle("old", ago >= 90);
    $("desc").textContent = desc;
    $("feel").textContent = "체감 " + Math.round(d.apparent_temperature) + "°";
    $("msg").textContent = message(t, theme);
    $("small").textContent = "기준 " + d.time.replace("T", " ") + " · Open-Meteo";
    document.body.className = d.is_day ? theme : "night";
    renderHourly(data.hourly, d.time);
    renderWeekly(data.daily);
    loadAir(lat, lon);
    setFx(theme, !d.is_day);
  } catch (e) {
    $("icon").textContent = "😢";
    $("desc").textContent = "날씨를 못 가져왔어요";
    $("msg").textContent = "인터넷 연결을 확인하고 새로고침해 주세요";
    $("small").textContent = "오류: " + (e.name === "AbortError" ? "응답 시간 초과" : e.message);
  }
}

sel.onchange = () => {
  if (sel.value === "__me__") return;
  current = sel.value; load(...CITIES[current]);
};

// 내 위치: 실제 좌표로 날씨를 보고, 가장 가까운 도시 이름을 표시
$("loc").onclick = () => {
  if (!navigator.geolocation) return alert("이 브라우저는 위치 기능을 지원하지 않아요");
  $("loc").textContent = "📍 위치 찾는 중...";
  navigator.geolocation.getCurrentPosition(p => {
    const { latitude: la, longitude: lo } = p.coords;
    let best = "원흥동", min = Infinity;
    for (const [n, [a, b]] of Object.entries(CITIES)) {
      const d = (a - la) ** 2 + ((b - lo) * Math.cos(la * Math.PI / 180)) ** 2;
      if (d < min) { min = d; best = n; }
    }
    const km = Math.sqrt(min) * 111;
    meOpt.text = km > 12 ? "📍 내 위치 (고양시 밖)" : "📍 내 위치 (고양시 " + best + " 근처)"; meOpt.hidden = false; sel.value = "__me__";
    $("loc").textContent = "📍 내 위치로 보기";
    load(la, lo);
  }, err => {
    $("loc").textContent = "📍 내 위치로 보기";
    alert(err.code === 1 ? "위치 권한이 꺼져 있어요. 브라우저 설정에서 허용해 주세요." : "위치를 찾지 못했어요. 잠시 후 다시 눌러 주세요.");
  }, { timeout: 10000, maximumAge: 300000 });
};


// ===== 날씨 배경 애니메이션 =====
const fxc = $("fx"), ctx = fxc.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W = 0, H = 0, parts = [], clouds = [], shoot = null, mode = { kind: "cloudy", night: false };
const rnd = (a, b) => a + Math.random() * (b - a);

// 구름은 한 번만 그려 두고 계속 재사용 (가벼움)
const cloudImg = (() => {
  const c = document.createElement("canvas"); c.width = 320; c.height = 150;
  const g = c.getContext("2d");
  [[90,85,60],[150,60,62],[215,82,58],[160,98,52],[60,100,38],[255,102,36]].forEach(([x,y,r]) => {
    const gr = g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,"rgba(255,255,255,.95)"); gr.addColorStop(.6,"rgba(255,255,255,.55)"); gr.addColorStop(1,"rgba(255,255,255,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  });
  return c;
})();

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  fxc.width = W * dpr; fxc.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  build();
}
function build() {
  const { kind, night } = mode, k = Math.max(.6, W * H / (390 * 800));
  parts = []; clouds = []; shoot = null;
  if (kind === "rainy") for (let i = 0; i < 90 * k; i++) parts.push({ x: rnd(0, W + 80), y: rnd(0, H), l: rnd(12, 26), v: rnd(10, 17), a: rnd(.25, .6) });
  if (kind === "snowy") for (let i = 0; i < 80 * k; i++) parts.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(1.6, 4.6), v: rnd(.4, 1.2), ph: rnd(0, 6.3), a: rnd(.55, .95) });
  if (kind === "sunny" && !night) for (let i = 0; i < 22; i++) parts.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(10, 38), v: rnd(.12, .35), ph: rnd(0, 6.3), a: rnd(.1, .22), h: [48, 38, 340, 20][i % 4] });
  if (night && kind !== "rainy" && kind !== "snowy") for (let i = 0; i < 70 * k; i++) parts.push({ x: rnd(0, W), y: rnd(0, H * .85), r: rnd(.6, 1.9), ph: rnd(0, 6.3), sp: rnd(.015, .04) });
  const nc = kind === "cloudy" ? 6 : (kind === "rainy" || kind === "snowy") ? 5 : (kind === "sunny" && !night) ? 2 : 0;
  for (let i = 0; i < nc; i++) clouds.push({ x: rnd(-200, W), y: rnd(10, H * .55), s: rnd(.7, 1.5), v: rnd(.1, .3), a: night ? rnd(.07, .14) : (kind === "cloudy" ? rnd(.35, .6) : rnd(.2, .4)) });
}
function setFx(kind, night) { mode = { kind, night }; build(); }

let t = 0;
function draw() {
  t++;
  ctx.clearRect(0, 0, W, H);
  const { kind, night } = mode;

  // 해/달 빛
  if (kind === "sunny" && !night) {
    const r = 220 + Math.sin(t / 60) * 14, g = ctx.createRadialGradient(W * .85, H * .08, 0, W * .85, H * .08, r);
    g.addColorStop(0, "rgba(255,225,130,.75)"); g.addColorStop(1, "rgba(255,225,130,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (night && kind !== "rainy" && kind !== "snowy") {
    const g = ctx.createRadialGradient(W * .82, H * .1, 0, W * .82, H * .1, 120);
    g.addColorStop(0, "rgba(255,248,215,.55)"); g.addColorStop(.25, "rgba(255,248,215,.18)"); g.addColorStop(1, "rgba(255,248,215,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,248,220,.95)"; ctx.beginPath(); ctx.arc(W * .82, H * .1, 15, 0, 7); ctx.fill();
  }

  // 구름
  for (const c of clouds) {
    ctx.globalAlpha = c.a;
    ctx.drawImage(cloudImg, c.x, c.y, 320 * c.s, 150 * c.s);
    if (!reduce) { c.x += c.v; if (c.x > W + 20) c.x = -320 * c.s; }
  }
  ctx.globalAlpha = 1;

  if (kind === "rainy") {
    ctx.lineCap = "round"; ctx.lineWidth = 1.4;
    for (const p of parts) {
      ctx.strokeStyle = night ? `rgba(190,210,255,${p.a})` : `rgba(80,115,185,${p.a})`;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.l * .25, p.y + p.l); ctx.stroke();
      if (!reduce) { p.y += p.v; p.x -= p.v * .25; if (p.y > H) { p.y = -p.l; p.x = rnd(0, W + 80); } }
    }
  } else if (kind === "snowy") {
    for (const p of parts) {
      ctx.fillStyle = `rgba(255,255,255,${p.a})`; ctx.strokeStyle = "rgba(150,170,225,.45)"; ctx.lineWidth = .8;
      ctx.beginPath(); ctx.arc(p.x + Math.sin(t / 50 + p.ph) * 14, p.y, p.r, 0, 7); ctx.fill(); ctx.stroke();
      if (!reduce) { p.y += p.v; if (p.y > H + 6) { p.y = -6; p.x = rnd(0, W); } }
    }
  } else if (kind === "sunny" && !night) {
    for (const p of parts) {
      const x = p.x + Math.sin(t / 90 + p.ph) * 18, g = ctx.createRadialGradient(x, p.y, 0, x, p.y, p.r);
      g.addColorStop(0, `hsla(${p.h},100%,75%,${p.a * 2})`); g.addColorStop(1, `hsla(${p.h},100%,75%,0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, 7); ctx.fill();
      if (!reduce) { p.y -= p.v; if (p.y < -p.r) { p.y = H + p.r; p.x = rnd(0, W); } }
    }
  } else if (night) {
    for (const p of parts) {
      ctx.fillStyle = `rgba(255,255,255,${.35 + .65 * Math.abs(Math.sin(t * p.sp + p.ph))})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    if (!reduce) {
      if (!shoot && Math.random() < .004) shoot = { x: rnd(W * .2, W), y: rnd(0, H * .3), life: 0 };
      if (shoot) {
        const a = 1 - shoot.life / 40, g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x + 70, shoot.y - 35);
        g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x + 70, shoot.y - 35); ctx.stroke();
        shoot.x -= 7; shoot.y += 3.5; if (++shoot.life > 40) shoot = null;
      }
    }
  }
  if (!reduce) requestAnimationFrame(draw);
}
addEventListener("resize", resize);
resize(); draw();

load(...CITIES[current]);
setInterval(() => lastCoords && load(...lastCoords), REFRESH_MS);
// 폰이 잠자기 후 돌아왔을 때 30분 넘게 지났으면 바로 새로고침
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && lastCoords && Date.now() - lastLoaded >= REFRESH_MS) load(...lastCoords);
});
</script>
